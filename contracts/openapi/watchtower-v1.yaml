openapi: 3.1.0
info:
  title: WatchTower Public API
  version: 1.2.0
  description: Stable public, authenticated, brief regeneration, and item exploration contract consumed by the WatchTower web and mobile clients.
servers:
  - url: https://watchtower.damao.io
paths:
  /api/auth/config:
    get:
      operationId: getAuthConfig
      responses:
        '200': { description: Public Auth0 issuer, audience, Apple connection, and interactive client IDs }
  /api/auth/me:
    get:
      operationId: getCurrentUser
      security: [{ auth0: [] }]
      responses:
        '200':
          description: Authenticated identity and allowlist-derived capabilities
          headers: { Cache-Control: { schema: { type: string, const: no-store } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AuthMe' } } }
        '401': { $ref: '#/components/responses/ProtectedError' }
        '503': { $ref: '#/components/responses/ProtectedError' }
  /api/auth/account:
    delete:
      operationId: deleteCurrentAccount
      security: [{ auth0: [] }]
      responses:
        '204': { description: Current Auth0 user and local identity data deleted }
        '401': { $ref: '#/components/responses/ProtectedError' }
        '502': { $ref: '#/components/responses/ProtectedError' }
        '503': { $ref: '#/components/responses/ProtectedError' }
  /api/feedback:
    get:
      operationId: getFeedback
      security: [{ auth0: [] }]
      parameters:
        - { name: entityId, in: query, schema: { type: array, maxItems: 20, items: { type: string } } }
      responses:
        '200': { description: Shared feedback values for requested entities }
        '401': { $ref: '#/components/responses/ProtectedError' }
        '403': { $ref: '#/components/responses/ProtectedError' }
        '503': { $ref: '#/components/responses/ProtectedError' }
  /api/feedback/{entityId}:
    parameters:
      - { name: entityId, in: path, required: true, schema: { type: string } }
    put:
      operationId: setFeedback
      security: [{ auth0: [] }]
      responses:
        '200': { description: Shared feedback replaced and modifier identity recorded }
        '401': { $ref: '#/components/responses/ProtectedError' }
        '403': { $ref: '#/components/responses/ProtectedError' }
        '503': { $ref: '#/components/responses/ProtectedError' }
    delete:
      operationId: deleteFeedback
      security: [{ auth0: [] }]
      responses:
        '204': { description: Shared feedback cleared }
        '401': { $ref: '#/components/responses/ProtectedError' }
        '403': { $ref: '#/components/responses/ProtectedError' }
        '503': { $ref: '#/components/responses/ProtectedError' }
  /api/briefs/latest:
    get:
      operationId: getLatestBrief
      responses:
        '200':
          description: Latest published brief
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/Brief' } }
        '304': { description: Cached representation is current }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/briefs/{date}:
    parameters:
      - $ref: '#/components/parameters/Date'
    get:
      operationId: getBrief
      responses:
        '200':
          description: Published brief for the requested UTC date
          content:
            application/json: { schema: { $ref: '#/components/schemas/Brief' } }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/briefs:
    get:
      operationId: listBriefs
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Cursor-paginated brief summaries
          content:
            application/json: { schema: { $ref: '#/components/schemas/BriefList' } }
  /api/briefs/{date}/audio:
    parameters:
      - $ref: '#/components/parameters/Date'
    get:
      operationId: getBriefAudio
      responses:
        '200': { description: Range-capable WAV audio stream }
        '206': { description: Partial WAV audio stream }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/briefs/{date}/audio/retry:
    parameters:
      - $ref: '#/components/parameters/Date'
    post:
      operationId: retryBriefAudio
      security: [{ auth0: [] }]
      responses:
        '200': { description: Audio job queued, already pending, or already ready }
        '401': { $ref: '#/components/responses/ProtectedError' }
        '403': { $ref: '#/components/responses/ProtectedError' }
        '503': { $ref: '#/components/responses/ProtectedError' }
  /api/briefs/{date}/cover:
    parameters:
      - $ref: '#/components/parameters/Date'
    get:
      operationId: getBriefCover
      responses:
        '200': { description: Generated podcast cover image }
        '304': { description: Cached cover is current }
        '404': { $ref: '#/components/responses/ApiError' }
  /api/briefs/{date}/cover/retry:
    parameters:
      - $ref: '#/components/parameters/Date'
    post:
      operationId: retryBriefCover
      security: [{ auth0: [] }]
      responses:
        '200': { description: Cover job queued, already pending, or already ready }
        '401': { $ref: '#/components/responses/ProtectedError' }
        '403': { $ref: '#/components/responses/ProtectedError' }
        '503': { $ref: '#/components/responses/ProtectedError' }
  /api/briefs/{date}/regeneration:
    parameters:
      - $ref: '#/components/parameters/Date'
    get:
      operationId: getBriefRegeneration
      security: [{ auth0: [] }]
      responses:
        '200':
          description: Latest regeneration job for the requested brief date
          headers: { Cache-Control: { schema: { type: string, const: no-store } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/BriefRegeneration' } } }
        '400': { $ref: '#/components/responses/ProtectedError' }
        '401': { $ref: '#/components/responses/ProtectedError' }
        '403': { $ref: '#/components/responses/ProtectedError' }
        '404': { $ref: '#/components/responses/ProtectedError' }
        '503': { $ref: '#/components/responses/ProtectedError' }
    post:
      operationId: regenerateBrief
      description: Queue an idempotent replay from candidates and evidence already stored for this date. It never re-runs Tavily and never sends a publication push.
      security: [{ auth0: [] }]
      responses:
        '202':
          description: Regeneration queued or the existing active job returned
          headers: { Cache-Control: { schema: { type: string, const: no-store } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/BriefRegeneration' } } }
        '400': { $ref: '#/components/responses/ProtectedError' }
        '401': { $ref: '#/components/responses/ProtectedError' }
        '403': { $ref: '#/components/responses/ProtectedError' }
        '404': { $ref: '#/components/responses/ProtectedError' }
        '409': { $ref: '#/components/responses/ProtectedError' }
        '503': { $ref: '#/components/responses/ProtectedError' }
  /api/mobile/v1/push-subscriptions:
    put:
      operationId: upsertPushSubscription
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/PushSubscription' } }
      responses:
        '204': { $ref: '#/components/responses/MobilePushNoContent' }
        '400': { $ref: '#/components/responses/MobilePushError' }
        '413': { $ref: '#/components/responses/MobilePushError' }
        '415': { $ref: '#/components/responses/MobilePushError' }
        '429': { $ref: '#/components/responses/MobilePushRateLimited' }
    delete:
      operationId: deletePushSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [installationSecret]
              properties:
                installationSecret: { type: string, minLength: 43, maxLength: 43 }
      responses:
        '204': { $ref: '#/components/responses/MobilePushNoContent' }
        '400': { $ref: '#/components/responses/MobilePushError' }
        '413': { $ref: '#/components/responses/MobilePushError' }
        '415': { $ref: '#/components/responses/MobilePushError' }
        '429': { $ref: '#/components/responses/MobilePushRateLimited' }
  /api/explorations/{briefDate}/{entityId}:
    parameters:
      - { name: briefDate, in: path, required: true, schema: { type: string, format: date } }
      - { name: entityId, in: path, required: true, schema: { type: string, pattern: '^entity_[a-f0-9]{32}$' } }
    get:
      operationId: getItemExploration
      responses:
        '200':
          description: Existing exploration state or result
          content:
            application/json: { schema: { $ref: '#/components/schemas/Exploration' } }
        '304': { description: Cached representation is current }
        '404': { $ref: '#/components/responses/ApiError' }
        '503': { $ref: '#/components/responses/ApiError' }
    post:
      operationId: triggerItemExploration
      responses:
        '200':
          description: Fresh or stale cached exploration result
          content:
            application/json: { schema: { $ref: '#/components/schemas/Exploration' } }
        '202':
          description: Exploration is queued or processing
          content:
            application/json: { schema: { $ref: '#/components/schemas/Exploration' } }
        '404': { $ref: '#/components/responses/ApiError' }
        '429':
          description: Exploration rate or daily credit limit reached
          headers:
            Retry-After: { schema: { type: string } }
          content:
            application/json: { schema: { $ref: '#/components/schemas/ApiError' } }
        '503': { $ref: '#/components/responses/ApiError' }
    options:
      operationId: optionsItemExploration
      responses:
        '204': { description: CORS preflight response }
components:
  securitySchemes:
    auth0:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.watchtower.damao.io/authorize
          tokenUrl: https://auth.watchtower.damao.io/oauth/token
          scopes: {}
  parameters:
    Date:
      name: date
      in: path
      required: true
      schema: { type: string, format: date }
  responses:
    ApiError:
      description: Stable error envelope
      content:
        application/json: { schema: { $ref: '#/components/schemas/ApiError' } }
    ProtectedError:
      description: Stable authenticated API error
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ApiError' } }
    MobilePushNoContent:
      description: Subscription stored, removed, or already absent
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
    MobilePushError:
      description: Invalid mobile push subscription request
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ApiError' } }
    MobilePushRateLimited:
      description: Mobile push subscription rate limit exceeded
      headers:
        Cache-Control: { schema: { type: string, const: no-store } }
        Retry-After: { schema: { type: string, const: '60' } }
      content:
        application/json: { schema: { $ref: '#/components/schemas/ApiError' } }
  schemas:
    AuthMe:
      type: object
      required: [user, capabilities]
      properties:
        user:
          type: object
          required: [id]
          properties: { id: { type: string } }
        capabilities:
          type: object
          required: [feedback, audioRetry, briefRegenerate]
          properties:
            feedback: { type: boolean }
            audioRetry: { type: boolean }
            briefRegenerate: { type: boolean }
    SourceKind: { type: string, enum: [hacker-news, product-hunt, github, kickstarter] }
    BriefStatus: { type: string, enum: [complete, partial] }
    SourceLink:
      type: object
      required: [source, kind, label, url]
      properties:
        source: { $ref: '#/components/schemas/SourceKind' }
        kind: { type: string, enum: [platform, original] }
        label: { type: string }
        url: { type: string, format: uri }
    BriefItem:
      type: object
      required: [rank, entityId, title, summary, whyItMatters, tags, continuity, sources]
      properties:
        rank: { type: integer, minimum: 1 }
        entityId: { type: string }
        title: { type: string }
        summary: { type: string }
        whyItMatters: { type: string }
        tags: { type: array, items: { type: string } }
        continuity: { type: object, required: [kind], additionalProperties: true }
        sources: { type: array, items: { $ref: '#/components/schemas/SourceLink' } }
    BriefCover:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending, failed, ready] }
        url: { type: string }
        generatedAt: { type: string, format: date-time }
        provider: { type: string, const: fal-ai }
        model: { type: string, const: fal-ai/recraft/v3/text-to-image }
        synthetic: { type: boolean, const: true }
    BriefAudio:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending, failed, ready] }
        url: { type: string }
        durationSeconds: { type: number }
        generatedAt: { type: string, format: date-time }
        transcript: { type: string }
        provider: { type: string }
        synthetic: { type: boolean }
        cover: { anyOf: [{ $ref: '#/components/schemas/BriefCover' }, { type: 'null' }] }
    Brief:
      type: object
      required: [date, status, publishedAt, generatedAt, headline, intro, missingSources, sourceCounts, audio, items]
      properties:
        date: { type: string, format: date }
        status: { $ref: '#/components/schemas/BriefStatus' }
        publishedAt: { type: string, format: date-time }
        generatedAt: { type: string, format: date-time }
        headline: { type: string }
        intro: { type: string }
        missingSources: { type: array, items: { $ref: '#/components/schemas/SourceKind' } }
        sourceCounts: { type: object, additionalProperties: { type: integer } }
        audio: { anyOf: [{ $ref: '#/components/schemas/BriefAudio' }, { type: 'null' }] }
        features:
          type: object
          properties:
            exploration: { type: boolean, default: false }
        items: { type: array, items: { $ref: '#/components/schemas/BriefItem' } }
    BriefSummary:
      type: object
      required: [date, status, publishedAt, itemCount, missingSources]
      properties:
        date: { type: string, format: date }
        status: { $ref: '#/components/schemas/BriefStatus' }
        publishedAt: { type: string, format: date-time }
        itemCount: { type: integer, minimum: 0 }
        missingSources: { type: array, items: { $ref: '#/components/schemas/SourceKind' } }
    BriefList:
      type: object
      required: [briefs, nextCursor]
      properties:
        briefs: { type: array, items: { $ref: '#/components/schemas/BriefSummary' } }
        nextCursor: { anyOf: [{ type: string }, { type: 'null' }] }
    BriefRegeneration:
      type: object
      required: [briefDate, jobId, status]
      properties:
        briefDate: { type: string, format: date }
        jobId: { type: string, format: uuid }
        status: { type: string, enum: [queued, processing, succeeded, failed] }
        attemptCount: { type: integer, minimum: 0 }
        errorCode: { anyOf: [{ type: string }, { type: 'null' }] }
        pollAfterSeconds: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        finishedAt: { anyOf: [{ type: string, format: date-time }, { type: 'null' }] }
    PushSubscription:
      type: object
      description: The development app ID must use sandbox; the production app ID must use production.
      required: [installationSecret, deviceToken, environment, appId, appVersion]
      properties:
        installationSecret: { type: string, minLength: 43, maxLength: 43 }
        deviceToken: { type: string, pattern: '^[a-f0-9]{64}$' }
        environment: { type: string, enum: [sandbox, production] }
        appId: { type: string, enum: [io.damao.watchtower.dev, io.damao.watchtower] }
        appVersion: { type: string }
    ExplorationSource:
      type: object
      required: [id, title, url, domain, queryKind]
      properties:
        id: { type: string }
        title: { type: string }
        url: { type: string, format: uri }
        domain: { type: string }
        queryKind: { type: string, enum: [context, products, perspectives, industry] }
    CitedText:
      type: object
      required: [text, sourceIds]
      properties:
        text: { type: string }
        sourceIds: { type: array, minItems: 1, items: { type: string } }
    ExplorationSections:
      type: object
      required: [overview, relatedProducts, perspectives, industry, watchNext]
      properties:
        overview: { $ref: '#/components/schemas/CitedText' }
        relatedProducts:
          type: array
          items:
            type: object
            required: [name, relation, summary, sourceIds]
            properties:
              name: { type: string }
              relation: { type: string }
              summary: { type: string }
              sourceIds: { type: array, items: { type: string } }
        perspectives:
          type: array
          items:
            type: object
            required: [label, summary, sourceIds]
            properties:
              label: { type: string }
              summary: { type: string }
              sourceIds: { type: array, items: { type: string } }
        industry: { anyOf: [{ $ref: '#/components/schemas/CitedText' }, { type: 'null' }] }
        watchNext:
          type: array
          items:
            type: object
            required: [signal, sourceIds]
            properties:
              signal: { type: string }
              sourceIds: { type: array, items: { type: string } }
    Exploration:
      type: object
      required: [entityId, title, status]
      properties:
        entityId: { type: string }
        title: { type: string }
        status: { type: string, enum: [queued, researching, synthesizing, ready, failed] }
        quality: { type: string, enum: [complete, partial] }
        generatedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        stale: { type: boolean }
        refreshing: { type: boolean }
        refreshLimited: { type: boolean }
        pollAfterSeconds: { type: integer, minimum: 1 }
        retryAt: { type: string, format: date-time }
        sections: { $ref: '#/components/schemas/ExplorationSections' }
        sources: { type: array, items: { $ref: '#/components/schemas/ExplorationSource' } }
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
