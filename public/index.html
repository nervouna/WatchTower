<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="每天更新的中文科技与产品热点简报">
    <title>WatchTower 热点简报</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
    <link rel="stylesheet" href="/styles.css">
    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.4.0/auth0-spa-js.production.js" integrity="sha384-4HtInVsou9+RJEQ0/2RM/578MlMOAPmcjvvNLiS1qzwk6wFIvU9ZHcF/QvP1sX92" crossorigin="anonymous" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>
    <header class="site-header">
      <nav class="nav" aria-label="主要导航">
        <a class="brand" href="/" aria-label="WatchTower 热点简报首页">
          <img class="brand-mark" src="/favicon.svg" alt="" width="32" height="32">
          <span>WatchTower</span>
        </a>
        <div class="nav-links">
          <a data-nav="latest" href="/">最新简报</a>
          <a data-nav="archive" href="/archive">历史归档</a>
        </div>
      </nav>
    </header>
    <main id="main" class="shell" tabindex="-1">
      <div id="app" aria-live="polite" aria-busy="true">
        <section class="state-card state-loading" aria-labelledby="loading-title">
          <p class="eyebrow">WATCHTOWER</p>
          <h1 id="loading-title" class="state-title">正在整理今日信号</h1>
          <p class="state-copy">简报马上就绪。</p>
          <div class="skeleton-lines" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </section>
      </div>
    </main>
    <footer class="footer">
      <div class="footer-inner">
        <p>每日 00:00 UTC 发布。内容由公开来源聚合整理，不代表平台官方排名。 <a href="/privacy">隐私说明</a></p>
        <button id="feedback-mode-button" class="feedback-mode-button" type="button">反馈模式</button>
      </div>
    </footer>
    <dialog id="feedback-dialog" class="feedback-dialog" aria-labelledby="feedback-dialog-title">
      <div id="feedback-form">
        <p class="eyebrow">ACCOUNT</p>
        <h2 id="feedback-dialog-title" class="dialog-title">账号与反馈模式</h2>
        <p id="feedback-account-copy" class="dialog-copy">使用 Apple 登录后可查看账号状态。阅读始终无需登录。</p>
        <p id="feedback-user-id" class="account-user-id" hidden></p>
        <p id="feedback-auth-error" class="feedback-auth-error" role="alert" hidden></p>
        <div class="dialog-actions">
          <button class="dialog-button dialog-button-secondary" type="button" data-dialog-cancel>取消</button>
          <button id="copy-user-id" class="dialog-button dialog-button-secondary" type="button" hidden>复制 user ID</button>
          <button id="logout-button" class="dialog-button dialog-button-secondary" type="button" hidden>退出登录</button>
          <button id="delete-account-button" class="dialog-button dialog-button-danger" type="button" hidden>删除账号</button>
          <button id="login-button" class="dialog-button dialog-button-primary" type="button">使用 Apple 登录</button>
        </div>
      </div>
    </dialog>
  </body>
</html>
