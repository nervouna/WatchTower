<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="每天更新的中文科技与产品热点简报">
    <title>WatchTower 热点简报</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
    <link rel="stylesheet" href="/styles.css">
    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.4.0/auth0-spa-js.production.js" integrity="sha384-4HtInVsou9+RJEQ0/2RM/578MlMOAPmcjvvNLiS1qzwk6wFIvU9ZHcF/QvP1sX92" crossorigin="anonymous" defer></script>
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>
    <header class="site-header">
      <nav class="masthead" aria-label="主要导航">
        <a class="wordmark" href="/" aria-label="WatchTower 首页">WatchTower</a>
        <div class="masthead-links">
          <a data-nav="latest" href="/">今日</a>
          <a data-nav="archive" href="/archive">归档</a>
          <button id="account-button" class="masthead-account" type="button">账号</button>
        </div>
      </nav>
    </header>
    <main id="main" tabindex="-1">
      <div id="app" aria-busy="true">
        <section class="page-state page-state-loading" aria-labelledby="loading-title">
          <h1 id="loading-title">正在加载简报</h1>
          <p>正在获取今天值得关注的技术与产品变化。</p>
          <div class="text-skeleton" aria-hidden="true"><span></span><span></span><span></span></div>
        </section>
      </div>
    </main>
    <footer class="site-footer">
      <p>每日 00:00 UTC 发布。内容由公开来源聚合整理，不代表平台官方排名。 <a href="/privacy">隐私说明</a></p>
    </footer>

    <dialog id="account-dialog" class="account-dialog" aria-labelledby="account-title">
      <form method="dialog" class="account-dialog-inner">
        <header class="dialog-header">
          <h2 id="account-title">账号</h2>
          <button class="text-button" type="submit" data-dialog-close>关闭</button>
        </header>
        <p id="account-copy" class="account-copy">使用 Apple 登录后可共享反馈。阅读始终无需登录。</p>
        <p id="account-user-id" class="account-user-id" hidden></p>
        <p id="account-error" class="account-error" role="alert" hidden></p>
        <div class="account-actions">
          <button id="login-button" class="control control-primary" type="button">使用 Apple 登录</button>
          <button id="copy-user-id" class="control control-secondary" type="button" hidden>复制 user ID</button>
          <button id="logout-button" class="control control-secondary" type="button" hidden>退出登录</button>
        </div>
        <section id="danger-zone" class="danger-zone" hidden aria-labelledby="danger-title">
          <h3 id="danger-title">危险操作</h3>
          <p>删除账号会清除账号资料和可关联的反馈记录，此操作无法撤销。</p>
          <button id="delete-account-button" class="control control-danger" type="button">删除账号</button>
        </section>
      </form>
    </dialog>
  </body>
</html>
