name: CI

on:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  worker-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: npm ci
      - run: node scripts/check-typegen.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm exec -- wrangler deploy --env= --dry-run --outdir dist/production
      - run: npm exec -- wrangler deploy --env dev --dry-run --outdir dist/dev
      - run: node scripts/secret-scan.mjs

  flutter:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Read pinned Flutter version
        id: flutter-version
        run: echo "version=$(tr -d '[:space:]' < .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true
      - run: npm run verify:mobile
